# Historical objective campaigns of August 2026, :zeroed cells (manifest id
# m4_objectives_icarai_zeroed): mse, huber, mae with a uniform 600 s cap per fit and a 900 s
# orchestration deadline, on M4 monthly, quarterly, yearly and weekly.
#
# Protocol: origin/paper/replication-staging-icarai, experiments/scripts/cell_worker.jl (cap
# argument 600, initialization :zeroed). The archived cells ran at feature-branch commit
# 87f7bfb (recovered from the reflog; not part of a release). A re-run executes the same
# protocol on the release code and is not expected to reproduce every archived digit.

id = "m4_objectives_icarai_zeroed"
kind = "m4"
protocol_status = "archived"
protocol_source = "origin/paper/replication-staging-icarai: experiments/scripts/cell_worker.jl"
frequencies = ["monthly", "quarterly", "yearly", "weekly"]
per_series_timeout_s = 900.0
max_failure_rate = 0.01

[auto_defaults]
initialization = "zeroed"
d = -1
D = -1
maxp = 5
maxd = 2
maxq = 5
maxP = 2
maxD = 1
maxQ = 2
maxOrder = 5
informationCriteria = "aicc"
allowMean = "nothing"
allowDrift = "nothing"
integrationTest = "kpssShort"
seasonalIntegrationTest = "seas"
assertStationarity = true
assertInvertibility = true
showLogs = false
outlierDetection = false
searchMethod = "stepwise"
parallel = false
seasonalForm = "multiplicative"
multistart = false
stationary = false
stationarityMargin = 1e-6
invertible = false
invertibilityMargin = 1e-6
constrainedRefit = false
rootMargin = 1e-2
optimizer = "Ipopt"
warmStartFromBox = true
maxTimeSeconds = 600.0
requireTermsWhenOverDifferenced = true
requireMAWhenDoublyDifferenced = false

[[arms]]
name = "mse"
engine = "julia"
auto = { objectiveFunction = "mse" }

[[arms]]
name = "huber"
engine = "julia"
auto = { objectiveFunction = "huber" }

[[arms]]
name = "mae"
engine = "julia"
auto = { objectiveFunction = "mae" }

[[arms]]
name = "naive2"
engine = "r"
method = "naive2"

[archived.mse]
file = "raw/m4-objectives-icarai-2026-08/campaigns/cel_mse_zeroed_{freq}.csv.gz"
order_columns = ["p", "d", "q", "P", "D", "Q"]
smape_column = "smape_total"
provenance = "ICARAI, commit 87f7bfb"

[archived.huber]
file = "raw/m4-objectives-icarai-2026-08/campaigns/cel_huber_zeroed_{freq}.csv.gz"
order_columns = ["p", "d", "q", "P", "D", "Q"]
smape_column = "smape_total"
provenance = "ICARAI, commit 87f7bfb"

[archived.mae]
file = "raw/m4-objectives-icarai-2026-08/campaigns/cel_mae_zeroed_{freq}.csv.gz"
order_columns = ["p", "d", "q", "P", "D", "Q"]
smape_column = "smape_total"
provenance = "ICARAI, commit 87f7bfb"

[archived.naive2]
file = "raw/m4-baselines-r-2026-07/{freq}/Naive/total.csv.gz"
smape_column = "sMAPE"
provenance = "M4 Naive2 code, R 4.4.1 via RCall, Windows, July 2026"
