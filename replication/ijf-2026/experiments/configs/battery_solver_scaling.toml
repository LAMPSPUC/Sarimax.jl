# July 2026 battery: how far direct SCIP certifies the MA(1) least-squares problem as T grows
# (manifest id battery_solver_scaling, table battery.solver_scaling = tab:solver_scaling).
#
# Protocol: artifacts/original-scripts/battery-2026-07/scripts/run_solver_scip_scaling.jl and
# setup/gen_sim_data.py. Unlike the other blocks, the archived records come from the v0.1.3 run
# (commit ecc4878, 2026-07-07; the script is identical at 8ffc512) and were appended over three
# invocations, two of which crashed (solver/scip_scaling_run{,2,3}.log). The port (deviations at
# its top and in experiments/runners/battery/PORTING.md) runs the archived protocol in one
# invocation: 600 s per instance, sizes 40..300, stop after two consecutive non-certified sizes
# (archived: certified up to T = 120, TIME_LIMIT at 150 and 200). The arguments below are that
# protocol written out. No package estimation API is involved (direct JuMP model).
#
# Needs SCIP (SCIP.jl 0.11.6, SCIP 8.0.x): the SCIP solves crash on Windows (upstream), so run
# this in the Linux container. Wall time: up to about 1.5 h of SCIP time on the archived machine;
# whether T = 100..150 certify within 600 s depends on the machine, so the Termination /
# Certified / RelGap cells near the frontier may legitimately differ.

id = "battery_solver_scaling"
kind = "script"
title = "Battery 2026-07: scalability frontier of exact SCIP certification for the MA(1) SSE model (600 s per instance)"
protocol_status = "archived"
protocol_source = "artifacts/original-scripts/battery-2026-07/scripts/run_solver_scip_scaling.jl, setup/gen_sim_data.py (records of the v0.1.3 run, ecc4878, 2026-07-07)"
tables_group = "battery"
tables = ["battery.solver_scaling"]

[[steps]]
engine = "python"
script = "experiments/runners/battery/setup/gen_sim_data.py"
args = []
timeout_s = 600

[[steps]]
engine = "julia"
script = "experiments/runners/battery/run_solver_scip_scaling.jl"
args = ["--budget", "600", "--sizes", "40,60,80,100,120,150,200,250,300"]
# worst case nine 600 s solves plus the brute-force audits of the certified sizes
timeout_s = 14400
