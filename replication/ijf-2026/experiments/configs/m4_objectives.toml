# Controlled comparison of estimation objectives on M4 (manifest id m4_objectives).
#
# PROVISIONAL. This experiment is being run by a separate workstream to replace the
# historically inconsistent objective tables of August 2026 (see m4_objectives_icarai_*).
# Its protocol is not frozen yet. The arms below are the release's (v1.0.0, 14dd581) own
# `auto` defaults written out explicitly, varying only the objective; they are a placeholder
# that lets the runner be exercised end to end. Before any number from this experiment is
# reported, this file must be replaced by the frozen protocol of the controlled experiment
# (see ARTIFACT_GUIDE.md, "Integration contract for m4_objectives"), and the archived results
# must be the ones produced with exactly this file and the release commit.

id = "m4_objectives"
kind = "m4"
protocol_status = "provisional"
protocol_note = "arms are placeholders (release defaults, objective varied); replace with the frozen protocol of the controlled experiment"
protocol_source = "release v1.0.0 (14dd581) defaults of Sarimax.auto"
frequencies = ["monthly", "quarterly", "yearly", "weekly"]
per_series_timeout_s = 3600.0
max_failure_rate = 0.01

[auto_defaults]
initialization = "innovations"
seasonalForm = "multiplicative"
exogDynamics = "armax"
penaltyTarget = "all"
penalty = "none"
presampleBurnIn = 12
stationary = true
stationarityMargin = 1e-6
invertible = false
invertibilityMargin = 1e-6
assertStationarity = true
assertInvertibility = true
rootMargin = 1e-2
constrainedRefit = false
searchMethod = "stepwise"
informationCriteria = "aicc"
integrationTest = "kpssShort"
seasonalIntegrationTest = "seas"
d = -1
D = -1
maxd = 2
maxD = 1
maxp = 5
maxq = 5
maxP = 2
maxQ = 2
maxOrder = 5
allowMean = "nothing"
allowDrift = "nothing"
multistart = false
warmStartFromBox = false
maxTimeSeconds = "nothing"
parallel = false
outlierDetection = false
requireTermsWhenOverDifferenced = false
requireMAWhenDoublyDifferenced = false
optimizer = "Ipopt"

[[arms]]
name = "mse"
engine = "julia"
auto = { objectiveFunction = "mse" }

[[arms]]
name = "mae"
engine = "julia"
auto = { objectiveFunction = "mae" }

[[arms]]
name = "huber"
engine = "julia"
auto = { objectiveFunction = "huber" }

[[arms]]
name = "ridge"
engine = "julia"
# Deprecated spelling in the release (a warning is printed once); equivalent to
# objectiveFunction = "mse", penalty = :elastic_net, alpha = 0, penaltyTarget = :dynamics with
# lambda = 2 * ridgeLambda. The controlled experiment must state which form it uses.
auto = { objectiveFunction = "ridge" }

[[arms]]
name = "naive2"
engine = "r"
method = "naive2"

[[arms]]
name = "auto_arima"
engine = "r"
method = "auto_arima"
