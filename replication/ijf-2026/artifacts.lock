# Location of the archived artifact bundle (the Zenodo data record of the IJF paper).
#
# The bundle has two parts, two tarballs of the same Zenodo record that extract into the same
# directory: part 1 (build_artifact_bundle.py, the maintainer host and the staging branches)
# and part 2 (build_artifact_part2.py, host RECREIO: the controlled m4_objectives campaign and
# the GAVEA raw archive). The CONTENT of each part is pinned by its inventory (artifacts.sha256,
# artifacts-part2.sha256: one SHA-256 per file), which is part of the image fingerprint. This
# file only says where to download the tarballs from; it is filled in when the Zenodo record is
# published, after the image is built, and is deliberately outside the fingerprint. Until
# then, provide the tarballs with
#   ./reproduce.sh fetch artifacts --from sarimax-ijf-2026-artifacts-v1.tar.gz \
#                                  --from sarimax-ijf-2026-artifacts-part2-v1.tar.gz
# or point --artifacts at an extracted copy of both.

[bundle]
name = "sarimax-ijf-2026-artifacts"
version = "1"
file = "sarimax-ijf-2026-artifacts-v1.tar.gz"
sha256 = "f1f73726294af8fb0b3634d3f80d425f7a645a4c42c449c7ba90f9d632a1bee8"
bytes = 296087734
inventory = "artifacts.sha256"
inventory_sha256 = "998ec67bfc8559a0c879301bd6a11adf58675cfe746208e0c58ad85d731e4333"
doi = ""          # version DOI of the Zenodo data record, once published
url = ""          # direct download URL of the tarball in that record, once published

[[parts]]
name = "sarimax-ijf-2026-artifacts-part2"
version = "1"
file = "sarimax-ijf-2026-artifacts-part2-v1.tar.gz"
sha256 = "1714e162dd3c011f4d3a72718c7f2cb6b53c87d6fbacf6cbe94af422d6e27084"
bytes = 298933451
inventory = "artifacts-part2.sha256"
inventory_sha256 = "dd93fc9e9f18a09e1bb6b191d706ca69bd14c4a4a4fb86b8ac742f3a674daa3e"
doi = ""          # the same Zenodo record as part 1, once published
url = ""
