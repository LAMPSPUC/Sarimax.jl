# Published replication image. Read by reproduce.sh; KEY=VALUE lines only.
#
# IMAGE_DIGEST is empty until the image is pushed to GitHub Container Registry at release
# time (an explicit maintainer action, .github/workflows/ijf-image-publish.yml). While it is
# empty, ./reproduce.sh builds the image locally from this checkout. Once it is set, the image
# is pulled by this immutable digest and its source fingerprint (a label of the image) must
# equal this checkout's, or reproduce.sh refuses to run it.
#
# This file is outside the source fingerprint on purpose: recording the digest of an image
# must not change the fingerprint of that image.
IMAGE_REPOSITORY=ghcr.io/lampspuc/sarimax-ijf-replication
IMAGE_TAG=ijf-2026-replication-v1.0.0
IMAGE_DIGEST=
SOURCE_FINGERPRINT=
SOURCE_REVISION=
