# Location of the archived artifact bundle (the Zenodo data record of the IJF paper).
#
# One tarball (build_artifact_bundle.py). Its CONTENT is pinned by its inventory
# (artifacts.sha256: one SHA-256 per file), which is part of the image fingerprint. This file
# only says where to download the tarball from; it is filled in when the Zenodo record is
# published, after the image is built, and is deliberately outside the fingerprint. Until
# then, provide the tarball with
#   ./reproduce.sh fetch artifacts --from sarimax-ijf-2026-artifacts-v1.tar.gz
# or point --artifacts at an extracted copy.

[bundle]
name = "sarimax-ijf-2026-artifacts"
version = "1"
file = "sarimax-ijf-2026-artifacts-v1.tar.gz"
sha256 = "0d42bcf2c122fa28356fcddea44969cf51fc016f4586ca8797efa6ce861d475d"
bytes = 377049495
inventory = "artifacts.sha256"
inventory_sha256 = "bc2b2313c170197c212ee5dd8afbc21ed0b82c8155eba5eb3279a65e3b3abd5f"
doi = ""          # version DOI of the Zenodo data record, once published
url = ""          # direct download URL of the tarball in that record, once published
