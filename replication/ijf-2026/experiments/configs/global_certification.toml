# Global-optimization certificates (manifest id global_optimization_grid; Table S5 =
# tab:global_experiment and the certified instances of Section 5.6 = sec:global_diagnostics).
#
# Runner: experiments/runners/global/run_global_certification.jl. The conditional least-squares
# problem of the package, solved by Ipopt and then by SCIP 8.0.0 with the lifted bilinear
# formulation of Section 3.2, innovation bounds |eps_t| <= sqrt(f_Ipopt) and the Ipopt warm start
# (Section 5.6), 600 s per instance. Records carry SCIP's status, primal and dual bounds, gap,
# nodes and the exact objective at SCIP's coefficients.
#
# PROVISIONAL: the instance list (global_certification_instances.toml) is a reconstruction of the
# August 2026 batch's design (same classes and counts as Table S5). The batch's own 46 instances
# are now archived (casos() in results/historical/certification-2026-08/received/harness/), but
# their coefficients are drawn through Base.hash, so porting them needs those values evaluated
# under the batch's Julia 1.12.3. Run with --experiment; `full --all` leaves it out until the
# list is the batch's.
# Use --jobs N: the runner starts N worker processes (SCIP is single-threaded). Linux container
# only (the Windows SCIP build crashes).

id = "global_optimization_grid"
kind = "script"
title = "Global certificates: Ipopt against SCIP with the lifted bilinear formulation on the Table S5 instance classes"
protocol_status = "provisional"
protocol_source = "manuscript Sections 3.2 and 5.6 and Table S5; coordination e-mail of 2026-08-21 (32 cases, 600 s, external harness)"

[[steps]]
engine = "julia"
script = "experiments/runners/global/run_global_certification.jl"
args = ["experiments/configs/global_certification_instances.toml", "--time-limit", "600"]
# 37 instances at up to 600 s each, divided by the number of workers (--jobs)
timeout_s = 28800
