# Location of the archived artifact bundle (the Zenodo data record of the IJF paper).
#
# The CONTENT of the bundle is pinned by artifacts.sha256 (one SHA-256 per file), which is
# part of the image fingerprint. This file only says where to download it from; it is filled
# in when the Zenodo record is published, after the image is built, and is deliberately
# outside the fingerprint. Until then, provide the bundle with
#   ./reproduce.sh fetch artifacts --from sarimax-ijf-2026-artifacts-v1.tar.gz
# or point --artifacts at an extracted copy.

[bundle]
name = "sarimax-ijf-2026-artifacts"
version = "1"
file = "sarimax-ijf-2026-artifacts-v1.tar.gz"
sha256 = "f1f73726294af8fb0b3634d3f80d425f7a645a4c42c449c7ba90f9d632a1bee8"
bytes = 296087734
inventory_sha256 = "998ec67bfc8559a0c879301bd6a11adf58675cfe746208e0c58ad85d731e4333"
doi = ""          # version DOI of the Zenodo data record, once published
url = ""          # direct download URL of the tarball in that record, once published
