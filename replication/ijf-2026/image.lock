# Published replication image. Read by reproduce.sh; KEY=VALUE lines only.
#
# The image was published to GitHub Container Registry by .github/workflows/ijf-image-publish.yml
# when the release tag ijf-2026-replication-v1.0.0 was pushed (built from that tag's commit).
# ./reproduce.sh pulls it by this immutable digest; its source fingerprint (a label of the image)
# must equal this checkout's, or reproduce.sh refuses to run it. With IMAGE_DIGEST empty,
# ./reproduce.sh builds the image locally from the checkout instead.
#
# This file is outside the source fingerprint on purpose: recording the digest of an image
# must not change the fingerprint of that image.
